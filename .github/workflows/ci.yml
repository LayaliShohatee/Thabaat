# Backlog #41: every push and pull request runs the same checks the team runs locally.
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thabaat-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: thabaat-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: thabaat-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: thabaat-backend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
